# Automatischer Retry wenn der geplante Bulk-Ingest (05:00 UTC) fehlschlägt.
# Läuft nur einmal pro Fehlschlag – kein Endlos-Loop (triggert nicht auf sich selbst).

name: Bulk Ingest Retry

on:
  workflow_run:
    workflows: [Bulk Ingest]
    types: [completed]
    branches: [main]

concurrency:
  group: bulk-ingest-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retry-on-failure:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.name == 'Bulk Ingest'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Retry bulk ingest
        run: npm run bulk:ingest
        timeout-minutes: 85

      - name: Commit updated bulk artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/bulk/*.json
          if git diff --staged --quiet; then
            echo "No bulk changes to commit"
          else
            for f in public/data/bulk/*.json; do
              size=$(wc -c < "$f")
              if [ "$size" -gt 2097152 ]; then
                echo "ERROR: $f exceeds 2MB ($size bytes)"
                exit 1
              fi
            done
            git commit -m "chore(bulk): retry refresh filtered tender artifacts"
            git push
          fi
