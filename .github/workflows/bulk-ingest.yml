# Bulk Ingest – täglicher Refresh der gefilterten Tender-Artefakte (public/data/bulk/).
#
# Einstellungen (warum):
# - concurrency: verhindert parallele Läufe (Cron + manuell), die sich beim git push blockieren
# - timeout 90 min / Schritt 85 min: ANAC + PCSP laden große Pakete (>500 MB)
# - NODE_OPTIONS 6 GB: große JSON/CSV-Puffer in Node verarbeiten
# - npm cache (setup-node): schnelleres npm ci
# - 05:00 UTC Hauptlauf, 06:00 UTC Backup (überspringt wenn Artefakte <3h frisch)
# - Bei Fehlschlag des Hauptlaufs: bulk-ingest-retry.yml startet automatisch
# - Job bleibt grün wenn alle 7 JSON-Artefakte vorhanden (ggf. refreshFailed-Fallback)
#
# Manuell: Actions → Bulk Ingest → Run workflow

name: Bulk Ingest

on:
  schedule:
    - cron: '0 5 * * *'   # Hauptlauf 05:00 UTC
    - cron: '0 6 * * *'   # Backup falls 05:00 fehlschlägt oder hängen bleibt
  workflow_dispatch:

concurrency:
  group: bulk-ingest-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bulk-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
      # Backup-Cron setzt Skip-Logik in run-all-bulk-jobs.mjs
      BULK_INGEST_BACKUP: ${{ github.event.schedule == '0 6 * * *' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run bulk ingest scripts
        run: npm run bulk:ingest
        timeout-minutes: 85

      - name: Commit updated bulk artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/bulk/*.json
          if git diff --staged --quiet; then
            echo "No bulk changes to commit"
          else
            for f in public/data/bulk/*.json; do
              size=$(wc -c < "$f")
              if [ "$size" -gt 2097152 ]; then
                echo "ERROR: $f exceeds 2MB ($size bytes)"
                exit 1
              fi
            done
            git commit -m "chore(bulk): daily refresh filtered tender artifacts"
            git push
          fi
