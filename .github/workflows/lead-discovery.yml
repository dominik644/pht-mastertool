# Lead Discovery – täglicher RSS/Google-News-Scan + Branchen-News Intelligence.
#
# Einstellungen:
# - concurrency: keine parallelen Läufe beim git push
# - timeout 45 min: viele externe Feeds
# - npm cache für schnelleres npm ci

name: Lead Discovery

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: lead-discovery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lead-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run lead discovery + news intelligence
        run: npm run lead-discovery
        timeout-minutes: 40

      - name: Commit updated lead artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/leads/*.json
          if git diff --staged --quiet; then
            echo "No lead changes to commit"
          else
            git commit -m "chore(leads): daily refresh lead discovery + news intelligence"
            git push
          fi
